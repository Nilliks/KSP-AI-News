<html><body>
{{> netbar}}
<div class="mast"><span class="name">Kerbin Science Review</span><span class="sub">Commentary from the Kerbin research community</span></div>
<div class="page">

  {{#articles}}{{> headline_item}}{{/articles}}
</div></body></html>
