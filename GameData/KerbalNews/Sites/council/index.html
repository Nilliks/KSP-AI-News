<html><body>
{{> netbar}}
<div class="mast"><div class="seal">PC</div><div><div class="name">Planetary Council Press Office</div><div class="sub">Official statements</div></div></div>
<div class="page">
  {{#empty}}<div class="empty"><p>The Council has issued no statements on the space program.</p></div>{{/empty}}
  {{#top}}<div class="notice"><div class="kicker">Statement &middot; {{date}}</div><a class="hl" href="{{url}}">{{headline}}</a><p>{{lead}}</p></div>{{/top}}
  {{#articles}}{{> headline_item}}{{/articles}}
</div></body></html>
